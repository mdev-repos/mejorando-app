<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1117" />
    <meta
      name="description"
      content="MejorAndo, una suite para mejorar tu salud, empezando por el entrenamiento."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>MejorAndo</title>
    <script>
      // aplica el tema elegido antes de pintar, para evitar un destello
      try {
        var t = localStorage.getItem('mejorando.tema')
        if (t === 'oscuro' || t === 'claro')
          document.documentElement.dataset.theme = t === 'oscuro' ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
